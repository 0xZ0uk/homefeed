[project]
name = "homefeed-worker"
version = "0.1.0"
description = "Homefeed background worker"
authors = [
    { name = "Pedro Santana", email = "pedrsntana@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3,<4",
    "homefeed-core",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
homefeed-core = { workspace = true }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
