[project]
name = "homefeed-api"
version = "0.1.0"
description = "Homefeed HTTP API"
authors = [
    { name = "Pedro Santana", email = "pedrsntana@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "homefeed-core",
    "homefeed-worker",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
homefeed-core = { workspace = true }
homefeed-worker = { workspace = true }

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
