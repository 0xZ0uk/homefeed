[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/core"]

# sentence-transformers needs torch; the CPU build avoids gigabytes of CUDA libraries.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/*/src", "packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID251"]

# PLAN.md ground rule 1: only the Gateway talks to YouTube.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"yt_dlp".msg = "Only homefeed_core.gateway may use yt-dlp; go through the Gateway."

[tool.ruff.lint.per-file-ignores]
"packages/core/src/homefeed_core/gateway/**" = ["TID251"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
