[project]
name = "homefeed-core"
version = "0.1.0"
description = "Homefeed domain logic"
authors = [
    { name = "Pedro Santana", email = "pedrsntana@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.4",
    "sqlite-vec>=0.1.9",
    "torch>=2.14.1",
    "yt-dlp>=2026.8.19",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
