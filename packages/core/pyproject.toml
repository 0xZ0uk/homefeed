[project]
name = "homefeed-core"
version = "0.1.0"
description = "Homefeed domain logic"
authors = [
    { name = "Pedro Santana", email = "pedrsntana@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3,<4",
    "fastembed>=0.9.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.4",
    "sqlite-vec>=0.1.9",
    "tzdata>=2026.5",
    "tzlocal>=5.4.4",
    "yt-dlp>=2026.8.19",
    "yt-dlp-ejs>=0.8.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
