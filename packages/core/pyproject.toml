[project]
name = "homefeed-core"
version = "0.1.0"
description = "Homefeed domain logic"
authors = [
    { name = "Pedro Santana", email = "pedrsntana@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
